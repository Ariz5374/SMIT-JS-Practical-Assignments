<!DOCTYPE html>

<body>
  <h1>Back to portal</h1>

  <script>
    // TASK 10 – Simple Calculator
   var num1 = +prompt("Enter first number")
   var num2 = +prompt("Enter second number")
   var operator = prompt("Select an operator\n+\n-\n*\n/")
   if(operator=="+"){
    var addition = num1+num2
    alert(`First number: ${num1}\n Second Number: ${num2}\nOperator: +\n Result: ${addition} `)
   }else{
    if(operator=="-"){
      var subtract = num1-num2
      alert(`First number: ${num1}\n Second Number: ${num2}\nOperator: -\n Result: ${subtract} `)
    }
    else{
      if(operator=="*"){
        var multiply = num1*num2
         alert(`First number: ${num1}\n Second Number: ${num2}\nOperator: *\n Result: ${multiply}`)

      } else{
        if(operator=="/"){
          var divide = num1/num2
          alert(`First number: ${num1}\n Second Number: ${num2}\nOperator: /\n Result: ${divide}`)

        }
      }
    }
   }
   


  </script>
</body>
</html>
