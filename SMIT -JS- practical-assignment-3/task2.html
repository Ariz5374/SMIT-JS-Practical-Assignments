<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Back to portal</h1>
    <a href="index.html">Main assignment page</a>

    <script>
      var ticket = [
        "Roller Coaster",
        "Water Park",
        "Haunted House",
        "All Access Pass",
      ];
      var ticketPrice = [800, 600, 400, 1500];
      var bookings = [];

      alert(`Welcome to Adventure Park\n
   1.${ticket[0]} - ${ticketPrice[0]}Rs\n
   2.${ticket[1]} - ${ticketPrice[1]}Rs\n
   3.${ticket[2]} - ${ticketPrice[2]}Rs\n
   4.${ticket[3]} - ${ticketPrice[3]}Rs\n`);

      var userChoice = +prompt("Please select your ticket(1-4)");
      var selectedTicket;
      var price;

      if (userChoice == "1") {
        selectedTicket = ticket[0];
        price = ticketPrice[0];
      } else if (userChoice == "2") {
        selectedTicket = ticket[1];
        price = ticketPrice[1];
      } else if (userChoice == "3") {
        selectedTicket = ticket[2];
        price = ticketPrice[2];
      } else if (userChoice == "4") {
        selectedTicket = ticket[3];
        price = ticketPrice[3];
      } else {
        alert("Please select a valid item number");
      }

      var userAge = +prompt("What is your age?");
      var quantity = +prompt(
        `How many tickets of ${selectedTicket} do you want?`,
      );

      if (userChoice == "1" && userAge < 12) {
        alert(
          "you are too young for rollercoaster please select a different ticket",
        );
      } else {
        alert("No age restriction all tickets are allowed");
      }

      var anotherTicket = +prompt(
        "Do you want to purchase another ticket?\n1.Yes\n2.no",
      );
      if (userChoice == "4" && anotherTicket == "1") {
        alert(
          "You are not eligible to buy another ticket becuse you have bought all access pass",
        );
      } else {
        if (anotherTicket == "1" && userChoice != "4") {
          alert(
            "you are eligible for another ticket however u have to book another slot",
          );
        }
      }

      var subTotal = price * quantity;
      var discount;
      if (quantity >= "4") {
        discount = subTotal * 0.1;
      } else {
        discount = 0;
      }
      var finalBill = subTotal - discount;
      alert(
        `Final bill: ${finalBill}\n subtotal: ${subTotal}\n discount: ${discount}`,
      );

      var booking =
        selectedTicket + " - " + quantity + " Tickets - Rs. " + finalBill;

      bookings.push(booking);

      var cancelBooking = +prompt(
        "Do you want to cancel your last booking?\n1. Yes\n2. No",
      );

      if (cancelBooking == 1) {
        bookings.pop();
        alert("Last booking cancelled!");
      } else {
        alert("No booking cancelled.");
      }

      var removeFirst = +prompt(
        "Do you want to remove the first booking from the queue?\n1. Yes\n2. No",
      );

      if (removeFirst == 1) {
        if (bookings.length > 0) {
          bookings.shift();
          alert("First booking removed!");
        } else {
          alert("No bookings available to remove.");
        }
      } else {
        alert("First booking not removed.");
      }

      console.log("----- ADVENTURE PARK BOOKING -----");
      console.log("Ticket:", selectedTicket);
      console.log("Age:", userAge);
      console.log("Quantity:", quantity);
      console.log("Subtotal:", subTotal);
      console.log("Discount:", discount);
      console.log("Final Bill:", finalBill);
      console.log(
        "Booking Status:",
        bookings.length > 0 ? "Confirmed" : "Cancelled",
      );
      console.log("All Bookings:", bookings);
    </script>
  </body>
</html>
